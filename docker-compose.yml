    ports:
      - "8015:5000"

  lab6:
    <<: *lab
    container_name: ctf-lab6
    environment:
      LAB: "6"
      SECRET_KEY_6: "${SECRET_KEY_6:?SECRET_KEY_6 wajib diisi di .env}"
      FLAG_6: "${FLAG_6:?FLAG_6 wajib diisi di .env}"
    ports:
      - "8016:5000"
