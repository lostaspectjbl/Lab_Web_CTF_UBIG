x-lab: &default-lab
  image: ctf-labs:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  lab1:
    <<: *default-lab
    container_name: nusatech-lab1
    ports:
      - "8011:5000"
    environment:
      - LAB=1
      - SECRET_KEY=${SECRET_KEY_1:?SECRET_KEY_1 wajib diisi di file .env}
      - FLAG_1=${FLAG_1:?FLAG_1 wajib diisi di file .env}

  lab2:
    <<: *default-lab
    container_name: nusatech-lab2
    ports:
      - "8012:5000"
